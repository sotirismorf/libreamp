name: Release

on:
  push:
    tags: ['v*']
  # "Run workflow" builds both packages as downloadable artifacts without publishing a release.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml, metainfo and changelog
        run: |
          v=${GITHUB_REF_NAME#v}
          fail=0
          grep -q "^version = \"$v\"$" Cargo.toml || { echo "::error::Cargo.toml version is not $v"; fail=1; }
          grep -q "<release version=\"$v\"" packaging/*.metainfo.xml || { echo "::error::metainfo has no <release> for $v"; fail=1; }
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $v"; fail=1; }
          exit $fail

  appimage:
    needs: check-version
    # Also runs on manual dispatch, when check-version is skipped.
    if: ${{ !failure() && !cancelled() }}
    # The oldest supported Ubuntu, so the AppImage runs on distributions with older glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: packaging/install-sdl-build-deps.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: packaging/appimage/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: dist/*
          if-no-files-found: error

  flatpak:
    needs: check-version
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install flatpak and Flathub's flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak
          # Ubuntu's AppArmor default blocks the unprivileged user namespaces bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # Brings its own current AppStream tooling; Ubuntu's is too old to compose metadata.
          flatpak install --user --noninteractive flathub org.flatpak.Builder
      - run: packaging/flatpak/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: dist/*
          if-no-files-found: error

  release:
    needs: [appimage, flatpak]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '/^## \[/ { if (on) exit; on = index($0, "[" v "]") > 0; next } on' \
            CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          name: LibreAmp ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
