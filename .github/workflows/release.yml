name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml, metainfo and changelog
        run: |
          v=${GITHUB_REF_NAME#v}
          fail=0
          grep -q "^version = \"$v\"$" Cargo.toml || { echo "::error::Cargo.toml version is not $v"; fail=1; }
          grep -q "<release version=\"$v\"" packaging/*.metainfo.xml || { echo "::error::metainfo has no <release> for $v"; fail=1; }
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $v"; fail=1; }
          exit $fail

  appimage:
    needs: check-version
    # The oldest supported Ubuntu, so the AppImage runs on distributions with older glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: packaging/install-sdl-build-deps.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: packaging/appimage/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: dist/*
          if-no-files-found: error

  flatpak:
    needs: check-version
    runs-on: ubuntu-24.04
    # Flathub's own build image and action: flatpak-builder and AppStream tooling as Flathub
    # uses them (Ubuntu's appstreamcli is too old to compose the metadata).
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - name: Bundle name
        id: bundle
        run: echo "name=LibreAmp-${GITHUB_REF_NAME#v}-x86_64.flatpak" >> "$GITHUB_OUTPUT"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.sotirismorf.LibreAmp.yml
          bundle: ${{ steps.bundle.outputs.name }}
          artifact-name: flatpak

  release:
    needs: [appimage, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '/^## \[/ { if (on) exit; on = index($0, "[" v "]") > 0; next } on' \
            CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          name: LibreAmp ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
